<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Official Inauguration Ceremony - DPCOE Department of Computer Engineering. Interactive ribbon-cutting ceremony and biometric inauguration authorization.">
  <link rel="icon" type="image/x-icon" href="/assets/favicon-CsLyGMpy.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon-CsLyGMpy.ico">
  <!-- Traditional Indian & Royal Serif Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Marcellus&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
  <title>DPCOE Computer Department - Inauguration Ceremony</title>
  <script type="module" crossorigin src="/assets/index-DKfRIH1o.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CO-gp42o.css">
</head>

<body>

  <div id="ceremony-bg"></div>

  <!-- PHASE 1: Executive Biometric Hand Scan Authorization Screen -->
  <div id="scan-screen">
    <!-- Soft Ambient Particles Canvas -->
    <canvas id="bg-cyber-canvas"></canvas>

    <!-- Traditional Ceremonial Indian Borders -->
    <div class="trad-border trad-border-top"></div>
    <div class="trad-border trad-border-bottom"></div>
    <div class="trad-border trad-border-left"></div>
    <div class="trad-border trad-border-right"></div>

    <!-- Traditional Rangoli/Mandala Corner Motifs -->
    <div class="trad-corner top-left"></div>
    <div class="trad-corner top-right"></div>
    <div class="trad-corner bottom-left"></div>
    <div class="trad-corner bottom-right"></div>

    <!-- Grand Traditional Indian Marigold & Mango Leaf Toran (Top Garland & Long Flower Strings) -->
    <div class="trad-toran-banner"></div>
    <div class="trad-toran-string string-far-left"></div>
    <div class="trad-toran-string string-mid-left"></div>
    <div class="trad-toran-string string-mid-right"></div>
    <div class="trad-toran-string string-far-right"></div>

    <!-- Symmetrical Dual Background Traditional Mandalas (Left & Right) -->
    <div class="trad-bg-mandala trad-bg-mandala-left"></div>
    <div class="trad-bg-mandala trad-bg-mandala-right"></div>

    <div class="executive-frame">
      <!-- Central Hand Scanner Wrapper -->
      <div id="hand-scanner-wrapper">
        <!-- Outer Glowing Accent Rings & Traditional Pattern Ring -->
        <div class="hud-ring-outer"></div>
        <div class="hud-ring-trad"></div>
        <div class="hud-ring-inner"></div>

        <!-- Circular Hand Scanner Touch Area -->
        <div id="hand-area">
          <img src="/assets/hand_scan_male.png" alt="Traditional Male Ceremonial Hand Scanner" class="hand-image">
          <!-- Laser Scan Beam -->
          <div id="scan-line"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PHASE 2: Silk Curtains -->
  <div class="curtain curtain-left"></div>
  <div class="curtain curtain-right"></div>

  <!-- Traditional Ceremonial Indian Patterns for Phase 2 Background -->
  <div class="ceremony-trad-border ceremony-trad-border-top"></div>
  <div class="ceremony-trad-border ceremony-trad-border-bottom"></div>

  <div class="ceremony-trad-corner ceremony-top-left"></div>
  <div class="ceremony-trad-corner ceremony-top-right"></div>
  <div class="ceremony-trad-corner ceremony-bottom-left"></div>
  <div class="ceremony-trad-corner ceremony-bottom-right"></div>

  <!-- Symmetrical Dual Background Mandalas for Phase 2 -->
  <div class="ceremony-bg-mandala ceremony-mandala-left"></div>
  <div class="ceremony-bg-mandala ceremony-mandala-right"></div>

  <!-- Central Ceremony Branding Content -->
  <div id="ceremony-container">
    <div id="college-title">Dhole Patil College of Engineering, Pune</div>
    <img id="ceremony-logo" src="/assets/logo.svg" alt="DPES Logo">
    <h1 id="ceremony-title">Department of Computer Engineering</h1>
    <div id="ceremony-status">✦ Official Inauguration Completed ✦</div>
    <div id="post-cut-message">Welcome to the Future of Innovation</div>
  </div>

  <!-- Canvas Layer for Physics Ribbon -->
  <canvas id="c"></canvas>

  <!-- Entrypoint Script -->

</body>

</html>
