<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPCOE Computer Department - Inauguration Ceremony</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      cursor: crosshair;
    }

    /* Central Ceremony Branding */
    #ceremony-container {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
      width: 90%;
      max-width: 800px;
    }

    /* --- Staggered Entrance Choreography --- */

    #college-title {
      color: #ff3636;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 15px;
      opacity: 0;
      transform: translateY(-18px);
      /* Stagger 1: Slide down with sharp deceleration */
      animation: slideDownFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    #ceremony-logo {
      max-width: 420px;
      width: 75vw;
      height: auto;
      scale: 0.8;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.08));
      opacity: 0;
      transform: scale(0.7);
      /* Stagger 2: Scale up with overshoot spring */
      animation: logoEntrance 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
      /* Post-cut reveal transition uses overshoot curve */
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
        filter 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #ceremony-logo.revealed {
      transform: scale(1.08);
      filter: drop-shadow(0 16px 40px rgba(0, 0, 0, 0.14));
    }

    #ceremony-title {
      color: #111827;
      font-weight: 600;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-top: 25px;
      font-size: 1.8rem;
      opacity: 0;
      transform: translateY(22px);
      /* Stagger 3: Slide up with smooth deceleration */
      animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }

    #ceremony-status {
      margin-top: 15px;
      font-size: 1.05rem;
      letter-spacing: 3px;
      color: #ba0d0d;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      /* Post-cut spring bounce transition */
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(186, 13, 13, 0.2);
    }

    #ceremony-status.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Post-cut reveal text */
    #post-cut-message {
      margin-top: 28px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #444;
      font-weight: 400;
      font-style: italic;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #post-cut-message.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* --- Keyframe Animations --- */

    @keyframes slideDownFade {
      0% {
        opacity: 0;
        transform: translateY(-18px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoEntrance {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }

      100% {
        opacity: 1;
        transform: scale(0.85);
      }
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Canvas Layer */
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
  </style>
</head>

<body>


  <div id="ceremony-container">
    <div id="college-title">Dhole Patil College of Engineering, Pune</div>
    <img id="ceremony-logo" src="logo.svg" alt="DPES Logo">
    <h1 id="ceremony-title">Department of Computer Engineering</h1>
    <div id="ceremony-status">✦ Official Inauguration Completed ✦</div>
    <div id="post-cut-message">Welcome to the Future of Innovation</div>
  </div>

  <div class="">

    <canvas id="c"></canvas>

    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      let width, height;
      let points = [];
      let constraints = [];
      let trail = [];
      let confetti = [];
      let sparks = [];
      let activeHoriz = null; // Uint8Array for zero-alloc O(1) quad rendering

      const friction = 0.99;
      let gravity = 0.3;
      let isSevered = false;

      // Ribbon Mesh Settings: Ultra-optimized, hyper-fast rigid ribbon
      const spacing = 34;
      const rows = 4;
      let cols;

      // Mouse state
      let mouse = { down: false, x: -1000, y: -1000 };
      let lastMouse = { x: -1000, y: -1000 };

      class Point {
        constructor(x, y, col, row) {
          this.x = x;
          this.y = y;
          this.px = x;
          this.py = y;
          this.vx = 0;
          this.vy = 0;
          this.pin_x = null;
          this.pin_y = null;
          this.col = col;
          this.row = row;
        }

        update() {
          if (this.pin_x !== null) {
            this.x = this.pin_x;
            this.y = this.pin_y;
            return;
          }

          this.vx = (this.x - this.px) * friction;
          this.vy = (this.y - this.py) * friction;

          this.px = this.x;
          this.py = this.y;

          this.x += this.vx;
          this.y += this.vy + gravity;
        }
      }

      class Constraint {
        constructor(p1, p2, isShear = false, isHorizontal = false) {
          this.p1 = p1;
          this.p2 = p2;
          this.length = isShear ? spacing * Math.SQRT2 : spacing;
          this.stiffness = 1.0;
          this.isHorizontal = isHorizontal;
        }

        resolve() {
          let dx = this.p1.x - this.p2.x;
          let dy = this.p1.y - this.p2.y;
          let distSq = dx * dx + dy * dy;
          if (distSq === 0) return;

          let dist = Math.sqrt(distSq);
          let diff = ((this.length - dist) / dist) * this.stiffness;

          if (this.p1.pin_x === null && this.p2.pin_x === null) {
            let px = dx * diff * 0.5;
            let py = dy * diff * 0.5;
            this.p1.x += px;
            this.p1.y += py;
            this.p2.x -= px;
            this.p2.y -= py;
          } else if (this.p1.pin_x !== null && this.p2.pin_x === null) {
            this.p2.x -= dx * diff;
            this.p2.y -= dy * diff;
          } else if (this.p1.pin_x === null && this.p2.pin_x !== null) {
            this.p1.x += dx * diff;
            this.p1.y += dy * diff;
          }
        }
      }

      function initCloth() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;

        points = [];
        constraints = [];
        confetti = [];
        sparks = [];
        isSevered = false;
        gravity = 0.3;
        document.getElementById('ceremony-status').classList.remove('visible');
        const hint = document.getElementById('hint');
        if (hint) hint.style.opacity = '1';

        cols = Math.floor(width / spacing);
        activeHoriz = new Uint8Array(rows * cols);
        activeHoriz.fill(1);

        const startY = height / 2;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            let pX = (x / (cols - 1)) * width;
            let pY = startY + y * spacing;
            let p = new Point(pX, pY, x, y);

            if (x === 0 || x === cols - 1) {
              p.pin_x = p.x;
              p.pin_y = p.y;
            }
            points.push(p);
          }
        }

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            let p = points[y * cols + x];
            if (x > 0) {
              constraints.push(new Constraint(p, points[y * cols + (x - 1)], false, true));
            }
            if (y > 0) {
              constraints.push(new Constraint(p, points[(y - 1) * cols + x], false, false));
            }
            if (x > 0 && y > 0) {
              constraints.push(new Constraint(p, points[(y - 1) * cols + (x - 1)], true, false));
            }
            if (x < cols - 1 && y > 0) {
              constraints.push(new Constraint(p, points[(y - 1) * cols + (x + 1)], true, false));
            }
          }
        }
      }

      // Spawn spark particles along the cut line
      function spawnSparks(x, y) {
        if (sparks.length > 25) return;
        for (let i = 0; i < 5; i++) {
          sparks.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            size: Math.random() * 3 + 2,
            color: Math.random() > 0.3 ? '#ffd700' : '#ffffff',
            life: 1.0
          });
        }
      }

      // Grand celebration confetti burst
      function triggerCelebration() {
        if (isSevered) return;
        isSevered = true;

        // Staggered post-cut reveal sequence using motion curves
        // 1. Logo scales up with overshoot (300ms delay for dramatic pause)
        setTimeout(() => {
          document.getElementById('ceremony-logo').classList.add('revealed');
        }, 300);

        // 2. Status badge springs in (600ms delay, after logo settles)
        setTimeout(() => {
          document.getElementById('ceremony-status').classList.add('visible');
        }, 600);

        // 3. Post-cut welcome message slides up (1000ms delay, final reveal)
        setTimeout(() => {
          document.getElementById('post-cut-message').classList.add('visible');
        }, 1000);

        const hint = document.getElementById('hint');
        if (hint) hint.style.opacity = '0';

        // Spawn metallic confetti pieces
        const colors = ['#ffd700', '#ba0d0d', '#ffffff', '#e6b800', '#ff4d4d', '#c0c0c0'];
        for (let i = 0; i < 150; i++) {
          confetti.push({
            x: Math.random() * width,
            y: Math.random() * (height * 0.4),
            vx: (Math.random() - 0.5) * 12,
            vy: Math.random() * -6 - 2,
            size: Math.random() * 9 + 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.2,
            osc: Math.random() * 10
          });
        }
      }

      function update() {
        // Blade Trail update
        if (mouse.x > 0 && mouse.y > 0) {
          trail.push({ x: mouse.x, y: mouse.y, age: 1.0 });
        }
        for (let i = trail.length - 1; i >= 0; i--) {
          trail[i].age -= 0.1;
          if (trail[i].age <= 0) trail.splice(i, 1);
        }

        // 100% Precise Slicing (Cuts ONLY when cursor moves directly over red ribbon body)
        let cutOccurred = false;
        if (mouse.x > 0 && mouse.y > 0 && points.length > 0) {
          let severedCols = new Set();

          for (let x = 0; x < cols - 1; x++) {
            let pTop = points[x];
            let pBottom = points[(rows - 1) * cols + x];
            if (!pTop || !pBottom) continue;

            let colX = (pTop.x + pBottom.x) / 2;
            let minY = Math.min(pTop.y, pBottom.y) - 30;
            let maxY = Math.max(pTop.y, pBottom.y) + 30;

            // Cut ONLY if mouse Y is within ribbon vertical band
            if (mouse.y >= minY && mouse.y <= maxY) {
              // A. Direct Hover / Touch Position Check
              if (Math.abs(mouse.x - colX) <= spacing * 0.9) {
                severedCols.add(x);
              }

              // B. Trajectory Swipe crossing column X horizontally or diagonally
              if (lastMouse.x > 0 && ((lastMouse.x <= colX && mouse.x >= colX) || (lastMouse.x >= colX && mouse.x <= colX))) {
                severedCols.add(x);
              }
            }
          }

          if (severedCols.size > 0) {
            for (let colIdx of severedCols) {
              let midPointX = (colIdx / (cols - 1)) * width;
              spawnSparks(midPointX, height / 2);

              for (let y = 0; y < rows; y++) {
                activeHoriz[y * cols + colIdx] = 0;
              }

              for (let i = constraints.length - 1; i >= 0; i--) {
                let c = constraints[i];
                let minC = Math.min(c.p1.col, c.p2.col);
                let maxC = Math.max(c.p1.col, c.p2.col);
                if (minC === colIdx && maxC === colIdx + 1) {
                  constraints.splice(i, 1);
                }
              }

              // Apply immediate downward physics impulse to severed ends
              for (let p of points) {
                if (Math.abs(p.col - colIdx) <= 3 && p.pin_x === null) {
                  p.vy += 14;
                }
              }
            }
            gravity = 1.0; // Gentle boost so severed halves fall gracefully
            cutOccurred = true;
          }

          if (cutOccurred) {
            triggerCelebration();
          }
        }

        // Physics integration
        for (let p of points) p.update();
        // 10 iterations = hyper-fast 144+ FPS & zero elasticity
        for (let i = 0; i < 10; i++) {
          for (let c of constraints) c.resolve();
        }

        // Update Sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          let s = sparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.2;
          s.life -= 0.05;
          if (s.life <= 0) sparks.splice(i, 1);
        }

        // Update Confetti
        for (let c of confetti) {
          c.x += c.vx + Math.sin(c.osc) * 1.5;
          c.y += c.vy + 3.0;
          c.vy = Math.min(c.vy + 0.1, 4.0);
          c.rotation += c.vRot;
          c.osc += 0.05;
        }

        lastMouse.x = mouse.x;
        lastMouse.y = mouse.y;
      }

      // Pure Classic Ribbon Red (Uniform Color)
      const quadColors = [
        '#ba0d0d', // Classic inauguration red
        '#cc1111', // Subtle silky shine
        '#ba0d0d'
      ];

      function draw() {
        ctx.clearRect(0, 0, width, height);

        if (!activeHoriz) return;

        // 1. Render Drop Shadow (Fast path offset, zero blur GPU overhead for 144+ FPS)
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        for (let y = 0; y < rows - 1; y++) {
          for (let x = 0; x < cols - 1; x++) {
            if (activeHoriz[y * cols + x] === 1) {
              let p1 = points[y * cols + x];
              let p2 = points[y * cols + x + 1];
              let p3 = points[(y + 1) * cols + x + 1];
              let p4 = points[(y + 1) * cols + x];

              ctx.beginPath();
              ctx.moveTo(p1.x + 6, p1.y + 10);
              ctx.lineTo(p2.x + 6, p2.y + 10);
              ctx.lineTo(p3.x + 6, p3.y + 10);
              ctx.lineTo(p4.x + 6, p4.y + 10);
              ctx.closePath();
              ctx.fill();
            }
          }
        }

        // 2. Render Main Red Silk Ribbon Quads
        for (let y = 0; y < rows - 1; y++) {
          ctx.fillStyle = quadColors[y] || quadColors[0];
          ctx.strokeStyle = quadColors[y] || quadColors[0];
          ctx.lineWidth = 1.0;

          for (let x = 0; x < cols - 1; x++) {
            if (activeHoriz[y * cols + x] === 1) {
              let p1 = points[y * cols + x];
              let p2 = points[y * cols + x + 1];
              let p3 = points[(y + 1) * cols + x + 1];
              let p4 = points[(y + 1) * cols + x];

              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.lineTo(p3.x, p3.y);
              ctx.lineTo(p4.x, p4.y);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          }
        }

        // 3. Draw Sparks
        for (let s of sparks) {
          ctx.fillStyle = s.color;
          ctx.globalAlpha = s.life;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // 4. Draw Blade Trail (Scissor slice trail effect)
        if (trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);
          for (let i = 1; i < trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
          }
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        // 5. Draw Confetti
        for (let c of confetti) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rotation);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
          ctx.restore();
        }

        // 6. Draw Golden Scissor Cursor Indicator
        if (mouse.x > 0 && mouse.y > 0) {
          ctx.save();
          ctx.translate(mouse.x + 12, mouse.y - 12);
          ctx.font = '22px sans-serif';
          ctx.fillStyle = '#d4af37';
          ctx.fillText('✂️', 0, 0);
          ctx.restore();
        }
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // --- EVENT LISTENERS ---
      window.addEventListener('mousedown', (e) => {
        mouse.down = true;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        lastMouse.x = mouse.x;
        lastMouse.y = mouse.y;
      });

      window.addEventListener('mouseup', () => { mouse.down = false; });

      window.addEventListener('mousemove', (e) => {
        if (lastMouse.x < 0) {
          lastMouse.x = e.clientX;
          lastMouse.y = e.clientY;
        }
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('touchstart', (e) => {
        mouse.down = true;
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        lastMouse.x = mouse.x;
        lastMouse.y = mouse.y;
      }, { passive: true });

      window.addEventListener('touchend', () => { mouse.down = false; });

      window.addEventListener('touchmove', (e) => {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      });

      window.addEventListener('resize', initCloth);

      initCloth();
      loop();
    </script>

</body>

</html>
