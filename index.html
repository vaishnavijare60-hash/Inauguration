<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPCOE Computer Department - Inauguration Ceremony</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    cursor: crosshair; 
  }

  /* Stage Background Spotlight */
  .spotlight {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    height: 90vh;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(186, 13, 13, 0.03) 50%, rgba(255, 255, 255, 0) 75%);
    pointer-events: none;
    z-index: 0;
    animation: pulseSpotlight 6s ease-in-out infinite alternate;
  }

  @keyframes pulseSpotlight {
    0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  }

  /* Central Ceremony Branding */
  #ceremony-container {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    animation: fadeIn 2s ease-out 0.3s forwards;
    pointer-events: none;
    width: 90%;
    max-width: 800px;
  }

  #college-title {
    color: #997300;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  #ceremony-logo {
    max-width: 420px;
    width: 75vw;
    height: auto;
    filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.08)); 
    transition: transform 0.5s ease;
  }

  #ceremony-title {
    color: #111827;
    font-weight: 600;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-top: 25px;
    font-size: 1.8rem;
  }

  #ceremony-status {
    margin-top: 15px;
    font-size: 1.05rem;
    letter-spacing: 3px;
    color: #ba0d0d;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(10px);
    transition: all 1s ease;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(186, 13, 13, 0.2);
  }

  #ceremony-status.visible {
    opacity: 1;
    transform: translateY(0);
  }

  @keyframes fadeIn {
    0% { opacity: 0; transform: translate(-50%, -46%); }
    100% { opacity: 1; transform: translate(-50%, -50%); }
  }

  /* Canvas Layer */
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
  }

  /* HUD Control Bar */
  .hud-bar {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 100;
    display: flex;
    gap: 12px;
  }

  .hud-btn {
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(0, 0, 0, 0.15);
    color: #111827;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-family: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .hud-btn:hover {
    background: #ffffff;
    border-color: #ba0d0d;
    color: #ba0d0d;
    box-shadow: 0 4px 12px rgba(186, 13, 13, 0.15);
  }

  /* Slicing Blade Cursor Effect */
  .cursor-hint {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    color: rgba(0, 0, 0, 0.4);
    font-weight: 500;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>

<div class="spotlight"></div>

<div id="ceremony-container">
  <div id="college-title">Dhole Patil College of Engineering, Pune</div>
  <img id="ceremony-logo" src="../dpes_new_logo (1).svg" alt="DPES Logo">
  <h1 id="ceremony-title">Department of Computer Engineering</h1>
  <div id="ceremony-status">✦ Official Inauguration Completed ✦</div>
</div>

<div class="hud-bar">
  <button class="hud-btn" id="btn-sound">🔊 Sound: ON</button>
  <button class="hud-btn" id="btn-reset">🔄 Reset Ribbon</button>
  <button class="hud-btn" id="btn-fullscreen">⛶ Fullscreen</button>
</div>

<div class="cursor-hint" id="hint">✂ Swipe / Drag across the ribbon to cut</div>

<canvas id="c"></canvas>

<script>
  // --- WEB AUDIO SYNTHESIZER ---
  let soundEnabled = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  // Snip sound effect (synthesized noise)
  function playSnipSound() {
    if (!soundEnabled) return;
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      let bufferSize = audioCtx.sampleRate * 0.08;
      let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      let data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      let noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      let filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1200;

      let gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
    } catch (e) {}
  }

  // Celebration Fanfare sound effect
  function playFanfareSound() {
    if (!soundEnabled) return;
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
      notes.forEach((freq, idx) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;

        let startTime = audioCtx.currentTime + idx * 0.08;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 1.2);
      });
    } catch(e) {}
  }

  // --- PHYSICS ENGINE ---
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  
  let width, height;
  let points = [];
  let constraints = [];
  let trail = [];
  let confetti = [];
  let sparks = [];
  
  const friction = 0.99;
  let gravity = 0.8;
  let isSevered = false;
  
  // Ribbon Mesh Settings: Ultra-optimized, hyper-fast rigid ribbon
  const spacing = 34;
  const rows = 4;
  let cols;
  
  // Mouse state
  let mouse = { down: false, x: -1000, y: -1000 };
  let lastMouse = { x: -1000, y: -1000 };

  class Point {
    constructor(x, y, col, row) {
      this.x = x;
      this.y = y;
      this.px = x;
      this.py = y;
      this.vx = 0;
      this.vy = 0;
      this.pin_x = null;
      this.pin_y = null;
      this.col = col;
      this.row = row;
    }
    
    update() {
      if (this.pin_x !== null) {
        this.x = this.pin_x;
        this.y = this.pin_y;
        return;
      }
      
      this.vx = (this.x - this.px) * friction;
      this.vy = (this.y - this.py) * friction;
      
      this.px = this.x;
      this.py = this.y;
      
      this.x += this.vx;
      this.y += this.vy + gravity;
    }
  }

  class Constraint {
    constructor(p1, p2, isShear = false, isHorizontal = false) {
      this.p1 = p1;
      this.p2 = p2;
      this.length = isShear ? spacing * Math.SQRT2 : spacing;
      this.stiffness = 1.0; 
      this.isHorizontal = isHorizontal;
    }
    
    resolve() {
      let dx = this.p1.x - this.p2.x;
      let dy = this.p1.y - this.p2.y;
      let distSq = dx * dx + dy * dy;
      if (distSq === 0) return;
      
      let dist = Math.sqrt(distSq);
      let diff = ((this.length - dist) / dist) * this.stiffness;
      
      if (this.p1.pin_x === null && this.p2.pin_x === null) {
        let px = dx * diff * 0.5;
        let py = dy * diff * 0.5;
        this.p1.x += px;
        this.p1.y += py;
        this.p2.x -= px;
        this.p2.y -= py;
      } else if (this.p1.pin_x !== null && this.p2.pin_x === null) {
        this.p2.x -= dx * diff;
        this.p2.y -= dy * diff;
      } else if (this.p1.pin_x === null && this.p2.pin_x !== null) {
        this.p1.x += dx * diff;
        this.p1.y += dy * diff;
      }
    }
  }

  function initCloth() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    points = [];
    constraints = [];
    confetti = [];
    sparks = [];
    isSevered = false;
    document.getElementById('ceremony-status').classList.remove('visible');
    document.getElementById('hint').style.opacity = '1';
    
    cols = Math.floor(width / spacing);
    const startY = height / 2;
    
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let pX = (x / (cols - 1)) * width;
        let pY = startY + y * spacing;
        let p = new Point(pX, pY, x, y);
        
        if (x === 0 || x === cols - 1) {
          p.pin_x = p.x;
          p.pin_y = p.y;
        }
        points.push(p);
      }
    }
    
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let p = points[y * cols + x];
        if (x > 0) {
          constraints.push(new Constraint(p, points[y * cols + (x - 1)], false, true));
        }
        if (y > 0) {
          constraints.push(new Constraint(p, points[(y - 1) * cols + x], false, false));
        }
        if (x > 0 && y > 0) {
          constraints.push(new Constraint(p, points[(y - 1) * cols + (x - 1)], true, false));
        }
        if (x < cols - 1 && y > 0) {
          constraints.push(new Constraint(p, points[(y - 1) * cols + (x + 1)], true, false));
        }
      }
    }
  }

  function lineIntersect(p0_x, p0_y, p1_x, p1_y, p2_x, p2_y, p3_x, p3_y) {
    let s1_x = p1_x - p0_x;
    let s1_y = p1_y - p0_y;
    let s2_x = p3_x - p2_x;
    let s2_y = p3_y - p2_y;

    let denom = -s2_x * s1_y + s1_x * s2_y;
    if (denom === 0) return false;

    let s = (-s1_y * (p0_x - p2_x) + s1_x * (p0_y - p2_y)) / denom;
    let t = ( s2_x * (p0_y - p2_y) - s2_y * (p0_x - p2_x)) / denom;

    return (s >= 0 && s <= 1 && t >= 0 && t <= 1);
  }

  // Spawn spark particles along the cut line
  function spawnSparks(x, y) {
    for (let i = 0; i < 6; i++) {
      sparks.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8 - 2,
        size: Math.random() * 3 + 2,
        color: Math.random() > 0.3 ? '#ffd700' : '#ffffff',
        life: 1.0
      });
    }
  }

  // Grand celebration confetti burst
  function triggerCelebration() {
    if (isSevered) return;
    isSevered = true;
    
    document.getElementById('ceremony-status').classList.add('visible');
    document.getElementById('hint').style.opacity = '0';
    playFanfareSound();

    // Spawn 250 metallic confetti pieces
    const colors = ['#ffd700', '#ba0d0d', '#ffffff', '#e6b800', '#ff4d4d', '#c0c0c0'];
    for (let i = 0; i < 260; i++) {
      confetti.push({
        x: Math.random() * width,
        y: Math.random() * (height * 0.4),
        vx: (Math.random() - 0.5) * 12,
        vy: Math.random() * -6 - 2,
        size: Math.random() * 10 + 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.2,
        osc: Math.random() * 10
      });
    }
  }

  function update() {
    // Blade Trail update
    if (mouse.x > 0 && mouse.y > 0) {
      trail.push({ x: mouse.x, y: mouse.y, age: 1.0 });
    }
    for (let i = trail.length - 1; i >= 0; i--) {
      trail[i].age -= 0.08;
      if (trail[i].age <= 0) trail.splice(i, 1);
    }

    // Razor-sharp touch & drag column slicing (Instant cut on tap or swipe, no slipping!)
    let cutOccurred = false;
    if (mouse.down && points.length > 0) {
      let severedCols = new Set();
      const ribbonTopY = points[0].y - 35;
      const ribbonBottomY = points[points.length - 1].y + 35;

      // 1. Direct Touch/Tap Hit Detection (Instant cut on tap anywhere on ribbon)
      if (mouse.y >= ribbonTopY && mouse.y <= ribbonBottomY) {
        let touchCol = Math.floor((mouse.x / width) * (cols - 1));
        if (touchCol >= 0 && touchCol < cols - 1) {
          severedCols.add(touchCol);
        }
      }

      // 2. Drag Swipe Hit Detection
      for (let c of constraints) {
        if (c.p1.col !== c.p2.col) {
          if (lineIntersect(lastMouse.x, lastMouse.y, mouse.x, mouse.y, c.p1.x, c.p1.y, c.p2.x, c.p2.y)) {
            severedCols.add(Math.min(c.p1.col, c.p2.col));
          }
        }
      }

      if (severedCols.size > 0) {
        for (let colIdx of severedCols) {
          let midPointX = (colIdx / (cols - 1)) * width;
          spawnSparks(midPointX, height / 2);
          
          for (let i = constraints.length - 1; i >= 0; i--) {
            let c = constraints[i];
            let minC = Math.min(c.p1.col, c.p2.col);
            let maxC = Math.max(c.p1.col, c.p2.col);
            if (minC === colIdx && maxC === colIdx + 1) {
              constraints.splice(i, 1);
            }
          }
        }
        cutOccurred = true;
      }

      if (cutOccurred) {
        playSnipSound();
        triggerCelebration();
      }
    }
    
    // Physics integration
    for (let p of points) p.update();
    // 15 iterations with 34px spacing = hyper-fast 144+ FPS & zero elasticity
    for (let i = 0; i < 15; i++) {
      for (let c of constraints) c.resolve();
    }

    // Update Sparks
    for (let i = sparks.length - 1; i >= 0; i--) {
      let s = sparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.2;
      s.life -= 0.04;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    // Update Confetti
    for (let c of confetti) {
      c.x += c.vx + Math.sin(c.osc) * 1.5;
      c.y += c.vy + 3.0; // Gravity
      c.vy = Math.min(c.vy + 0.1, 4.0);
      c.rotation += c.vRot;
      c.osc += 0.05;
    }
    
    lastMouse.x = mouse.x;
    lastMouse.y = mouse.y;
  }

  // Pure Classic Ribbon Red (Uniform Color)
  const quadColors = [
    '#ba0d0d', // Classic inauguration red
    '#cc1111', // Subtle silky shine
    '#ba0d0d'
  ];

  function draw() {
    ctx.clearRect(0, 0, width, height);
    
    // 1. Draw Sleek Cloth Ribbon Quads with Hardware-Accelerated Drop Shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 6;
    ctx.shadowOffsetY = 10;

    // Helper map of active horizontal constraints for 100% glitch-free quad rendering
    let activeHoriz = new Set();
    for (let c of constraints) {
      if (c.isHorizontal) {
        let minC = Math.min(c.p1.col, c.p2.col);
        activeHoriz.add(c.p1.row + '_' + minC);
      }
    }

    for (let y = 0; y < rows - 1; y++) {
      ctx.fillStyle = quadColors[y] || quadColors[0];
      ctx.strokeStyle = quadColors[y] || quadColors[0]; 
      ctx.lineWidth = 1.5; 
      
      for (let x = 0; x < cols - 1; x++) {
        // Quad is rendered only if top horizontal link is active!
        if (activeHoriz.has(y + '_' + x)) {
          let p1 = points[y * cols + x];
          let p2 = points[y * cols + x + 1];
          let p3 = points[(y + 1) * cols + x + 1];
          let p4 = points[(y + 1) * cols + x];

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.lineTo(p4.x, p4.y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }
    }
    ctx.restore();

    // 3. Draw Sparks
    for (let s of sparks) {
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.life;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // 4. Draw Blade Trail (Scissor slice trail effect)
    if (trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(trail[0].x, trail[0].y);
      for (let i = 1; i < trail.length; i++) {
        ctx.lineTo(trail[i].x, trail[i].y);
      }
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#d4af37';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 5. Draw Confetti
    for (let c of confetti) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rotation);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
      ctx.restore();
    }

    // 6. Draw Golden Scissor Cursor Indicator
    if (mouse.x > 0 && mouse.y > 0) {
      ctx.save();
      ctx.translate(mouse.x + 12, mouse.y - 12);
      ctx.font = '22px sans-serif';
      ctx.fillStyle = '#d4af37';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 6;
      ctx.fillText('✂️', 0, 0);
      ctx.restore();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // --- EVENT LISTENERS ---
  window.addEventListener('mousedown', (e) => {
    mouse.down = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    lastMouse.x = mouse.x;
    lastMouse.y = mouse.y;
    initAudio();
  });

  window.addEventListener('mouseup', () => { mouse.down = false; });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  
  window.addEventListener('touchstart', (e) => {
    mouse.down = true;
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    lastMouse.x = mouse.x;
    lastMouse.y = mouse.y;
    initAudio();
  }, { passive: true });
  
  window.addEventListener('touchend', () => { mouse.down = false; });
  
  window.addEventListener('touchmove', (e) => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  });

  window.addEventListener('resize', initCloth);

  // HUD Buttons
  document.getElementById('btn-reset').addEventListener('click', initCloth);

  document.getElementById('btn-sound').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    document.getElementById('btn-sound').innerText = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
  });

  document.getElementById('btn-fullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  // Initialize
  initCloth();
  loop();
</script>

</body>
</html>
