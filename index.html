<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Official Inauguration Ceremony - DPCOE Department of Computer Engineering. Interactive ribbon-cutting ceremony and biometric inauguration authorization.">
  <title>DPCOE Computer Department - Inauguration Ceremony</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      cursor: crosshair;
    }

    /* Blurred college building background for ribbon cutting page */
    #ceremony-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('college_building.jpg') center center / cover no-repeat;
      filter: blur(4px);
      transform: scale(1.05);
      /* prevent blur edge artifacts */
    }

    #ceremony-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.35);
    }

    /* Central Ceremony Branding (Proportionately Sized for Big Displays) */
    #ceremony-container {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
      width: 90%;
      max-width: 900px;
    }

    /* --- Balanced Typography for Big Screen Digital Teaching Boards --- */

    #college-title {
      color: #9c1111;
      font-size: clamp(0.95rem, 1.4vw, 1.8rem);
      font-weight: 700;
      letter-spacing: clamp(2px, 0.4vw, 5px);
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(-18px);
    }

    #college-title.animate {
      animation: slideDownFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    #ceremony-logo {
      max-width: clamp(240px, 25vw, 420px);
      width: 65vw;
      height: auto;
      scale: 0.85;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.08));
      opacity: 0;
      transform: scale(0.7);
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1),
        filter 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #ceremony-logo.animate {
      animation: logoEntrance 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    }

    #ceremony-logo.revealed {
      transform: scale(1.05);
      filter: drop-shadow(0 14px 35px rgba(0, 0, 0, 0.15));
    }

    #ceremony-title {
      color: #111827;
      font-weight: 700;
      letter-spacing: clamp(3px, 0.5vw, 8px);
      text-transform: uppercase;
      margin-top: 20px;
      font-size: clamp(1.4rem, 2.3vw, 2.8rem);
      opacity: 0;
      transform: translateY(22px);
    }

    #ceremony-title.animate {
      animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
    }

    #ceremony-status {
      margin-top: 16px;
      font-size: clamp(0.95rem, 1.4vw, 1.6rem);
      letter-spacing: clamp(2px, 0.4vw, 5px);
      color: #9c1111;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-weight: 800;
      text-shadow: 0 3px 12px rgba(156, 17, 17, 0.2);
    }

    #ceremony-status.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Post-cut reveal text */
    #post-cut-message {
      margin-top: 22px;
      font-size: clamp(1rem, 1.5vw, 1.8rem);
      letter-spacing: clamp(1.5px, 0.3vw, 4px);
      color: #334155;
      font-weight: 500;
      font-style: italic;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #post-cut-message.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* --- Keyframe Animations --- */

    @keyframes slideDownFade {
      0% {
        opacity: 0;
        transform: translateY(-18px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoEntrance {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }

      100% {
        opacity: 1;
        transform: scale(0.85);
      }
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ====== PHASE 1: Professional Executive Authorization Screen ====== */
    #scan-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: radial-gradient(circle at center, #fffdf8 0%, #fef6e8 50%, #fdf0d5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: default;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #scan-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Background Ambient Canvas & Grid */
    #bg-cyber-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cyber-bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(184, 134, 11, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(184, 134, 11, 0.06) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .hud-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 2.5vw, 40px);
    }

    .hud-corner {
      position: absolute;
      width: clamp(24px, 3vw, 45px);
      height: clamp(24px, 3vw, 45px);
      border-color: #b8860b;
      border-style: solid;
      opacity: 0.6;
      pointer-events: none;
    }

    .hud-corner.top-left {
      top: 24px;
      left: 24px;
      border-width: 2px 0 0 2px;
    }

    .hud-corner.top-right {
      top: 24px;
      right: 24px;
      border-width: 2px 2px 0 0;
    }

    .hud-corner.bottom-left {
      bottom: 24px;
      left: 24px;
      border-width: 0 0 2px 2px;
    }

    .hud-corner.bottom-right {
      bottom: 24px;
      right: 24px;
      border-width: 0 2px 2px 0;
    }

    #scan-title {
      color: #1a1a2e;
      font-size: clamp(0.85rem, 1.3vw, 1.5rem);
      letter-spacing: clamp(3px, 0.4vw, 6px);
      text-transform: uppercase;
      margin-bottom: clamp(16px, 2.5vh, 36px);
      z-index: 2;
      text-shadow: 0 2px 12px rgba(184, 134, 11, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      text-align: center;
    }

    .symbol-accent {
      color: #9c1111;
    }

    /* Side Telemetry Panels (Scaled Comfortably for Teaching Boards) */
    .side-hud-panel {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.8vh, 24px);
      z-index: 2;
      pointer-events: none;
    }

    .left-panel {
      left: clamp(24px, 3vw, 60px);
    }

    .right-panel {
      right: clamp(24px, 3vw, 60px);
    }

    @media (max-width: 960px) {
      .side-hud-panel {
        display: none;
      }
    }

    .hud-box {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(184, 134, 11, 0.3);
      border-radius: 10px;
      padding: clamp(10px, 1vw, 18px);
      width: clamp(160px, 14vw, 230px);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .hud-box-title {
      font-size: clamp(0.65rem, 0.75vw, 0.9rem);
      color: #9c1111;
      letter-spacing: 2px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(156, 17, 17, 0.2);
      padding-bottom: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.65rem, 0.75vw, 0.88rem);
      color: #555;
      margin-bottom: 6px;
    }

    .stat-val {
      color: #1a1a2e;
      font-weight: 600;
    }

    /* Central Scanner Wrapper */
    #hand-scanner-wrapper {
      position: relative;
      width: clamp(240px, 21vw, 370px);
      height: clamp(270px, 24vw, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Outer Concentric Accent Rings */
    .hud-ring-outer {
      position: absolute;
      width: clamp(240px, 21vw, 360px);
      height: clamp(240px, 21vw, 360px);
      border: 1.2px dashed rgba(184, 134, 11, 0.35);
      border-radius: 50%;
      animation: rotateClockwise 30s linear infinite;
      pointer-events: none;
    }

    .hud-ring-inner {
      position: absolute;
      width: clamp(210px, 18vw, 310px);
      height: clamp(210px, 18vw, 310px);
      border: 1.5px solid rgba(184, 134, 11, 0.2);
      border-top-color: #b8860b;
      border-bottom-color: #b8860b;
      border-radius: 50%;
      animation: rotateCounterClockwise 20s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateClockwise {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateCounterClockwise {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(-360deg);
      }
    }

    /* Hand Scanner Box */
    #hand-area {
      width: clamp(170px, 15vw, 250px);
      height: clamp(210px, 19vw, 310px);
      position: relative;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid rgba(184, 134, 11, 0.5);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 0 25px rgba(184, 134, 11, 0.08), 0 10px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      padding: clamp(10px, 1vw, 18px);
      overflow: hidden;
    }

    #hand-area:hover {
      border-color: #b8860b;
      box-shadow: inset 0 0 35px rgba(184, 134, 11, 0.15), 0 0 40px rgba(184, 134, 11, 0.25);
      transform: scale(1.02);
    }

    #hand-area.scanning {
      border-color: #9c1111;
      box-shadow: inset 0 0 45px rgba(156, 17, 17, 0.15), 0 0 50px rgba(156, 17, 17, 0.3);
    }

    #hand-area.granted {
      border-color: #27ae60;
      box-shadow: inset 0 0 55px rgba(39, 174, 96, 0.2), 0 0 60px rgba(39, 174, 96, 0.4);
    }

    .hand-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(184, 134, 11, 0.4));
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    #hand-area:hover .hand-image {
      filter: drop-shadow(0 0 20px rgba(184, 134, 11, 0.6));
      transform: scale(1.03);
    }

    #hand-area.scanning .hand-image {
      filter: drop-shadow(0 0 28px #9c1111);
    }

    /* Laser Scan Beam */
    #scan-line {
      position: absolute;
      left: 10px;
      right: 10px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #9c1111, #ff4444, #9c1111, transparent);
      border-radius: 2px;
      top: 10px;
      opacity: 0;
      box-shadow: 0 0 15px #9c1111, 0 0 30px rgba(156, 17, 17, 0.5);
      z-index: 10;
    }

    #hand-area.scanning #scan-line {
      opacity: 1;
      animation: scanMove 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes scanMove {
      0% {
        top: 10px;
      }

      50% {
        top: calc(100% - 14px);
      }

      100% {
        top: 10px;
      }
    }

    /* Scan Status & Progress Bar */
    #scan-status-container {
      margin-top: clamp(16px, 2.2vh, 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      width: clamp(240px, 24vw, 420px);
    }

    #scan-status {
      font-size: clamp(0.75rem, 1.1vw, 1.25rem);
      letter-spacing: clamp(2.5px, 0.3vw, 5px);
      text-transform: uppercase;
      color: #555;
      transition: color 0.4s;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      text-align: center;
    }

    #scan-status.granted {
      color: #27ae60;
      text-shadow: 0 0 14px rgba(39, 174, 96, 0.5);
    }

    .progress-bar-track {
      width: 100%;
      height: clamp(6px, 0.8vh, 10px);
      background: rgba(184, 134, 11, 0.12);
      border-radius: 4px;
      border: 1px solid rgba(184, 134, 11, 0.3);
      overflow: hidden;
      margin-bottom: 8px;
    }

    #scan-progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #9c1111, #e63946);
      box-shadow: 0 0 12px rgba(156, 17, 17, 0.4);
      transition: width 0.1s linear;
    }

    #scan-percent {
      font-family: monospace;
      font-size: clamp(0.75rem, 0.95vw, 1.1rem);
      color: #9c1111;
      letter-spacing: 2px;
      font-weight: 700;
    }

    /* ====== PHASE 2: Lock Overlay ====== */
    #lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      background: rgba(255, 253, 248, 0.92);
      backdrop-filter: blur(12px);
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #lock-overlay.visible {
      opacity: 1;
    }

    #lock-overlay.hidden {
      opacity: 0;
    }

    #lock-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.9);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #lock-overlay.visible #lock-wrapper {
      transform: scale(1);
    }

    .lock-svg {
      width: clamp(100px, 12vw, 170px);
      height: clamp(100px, 12vw, 170px);
      filter: drop-shadow(0 0 24px rgba(156, 17, 17, 0.3));
    }

    #lock-shackle {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 115px 70px;
    }

    #lock-shackle.unlocked-shackle {
      transform: translateY(-14px) rotate(-22deg);
      stroke: #27ae60;
    }

    #lock-status-text {
      margin-top: 18px;
      font-size: clamp(0.9rem, 1.4vw, 1.6rem);
      letter-spacing: clamp(3px, 0.4vw, 7px);
      color: #9c1111;
      text-shadow: 0 0 12px rgba(156, 17, 17, 0.3);
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }

    /* ====== PHASE 3: Curtains ====== */
    .curtain {
      position: fixed;
      top: 0;
      width: 50%;
      height: 100%;
      z-index: 400;
      background: linear-gradient(180deg, #1a0000 0%, #3d0000 30%, #2a0000 70%, #0d0000 100%);
      transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .curtain-left {
      left: 0;
      transform: translateX(0);
    }

    .curtain-right {
      right: 0;
      transform: translateX(0);
    }

    .curtain-left.open {
      transform: translateX(-105%);
    }

    .curtain-right.open {
      transform: translateX(105%);
    }

    /* Curtain fabric folds */
    .curtain::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg,
          transparent 0px, rgba(255, 255, 255, 0.03) 15px,
          transparent 30px, rgba(0, 0, 0, 0.15) 45px);
    }

    /* Canvas Layer */
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="ceremony-bg"></div>

  <div id="scan-screen">
    <canvas id="bg-cyber-canvas"></canvas>
    <div class="cyber-bg-grid"></div>

    <div class="hud-frame">
      <div class="hud-corner top-left"></div>
      <div class="hud-corner top-right"></div>
      <div class="hud-corner bottom-left"></div>
      <div class="hud-corner bottom-right"></div>

      <!-- Professional Header Title -->
      <div id="scan-title">
        <span class="symbol-accent">❖</span> DEPARTMENT OF COMPUTER ENGINEERING<span class="symbol-accent">❖</span>
      </div>

    </div>

    <div id="lock-overlay">
      <div id="lock-wrapper">
        <svg viewBox="0 0 200 200" class="lock-svg">
          <defs>
            <filter id="lock-glow-filter">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Outer Rotating Ring -->
          <circle cx="100" cy="100" r="85" fill="none" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="10 5"
            class="hud-rotate" />
          <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(184, 134, 11, 0.4)" stroke-width="1"
            stroke-dasharray="3 6" class="hud-rotate-reverse" />

          <!-- Shield Base -->
          <path d="M 100 45 L 140 60 V 105 C 140 135 100 155 100 155 C 100 155 60 135 60 105 V 60 Z"
            fill="rgba(156, 17, 17, 0.85)" stroke="#b8860b" stroke-width="2.5" filter="url(#lock-glow-filter)" />

          <!-- Lock Shackle -->
          <path id="lock-shackle" d="M 85 85 V 70 C 85 60 115 60 115 70 V 85" fill="none" stroke="#9c1111"
            stroke-width="4" stroke-linecap="round" />

          <!-- Lock Body -->
          <rect x="80" y="85" width="40" height="32" rx="4" fill="#9c1111" opacity="0.95" />

          <!-- Keyhole Core -->
          <circle cx="100" cy="98" r="3.5" fill="#fef6e8" />
          <polygon points="98,98 102,98 103,109 97,109" fill="#fef6e8" />
        </svg>
        <div id="lock-status-text">OFFICIAL CEREMONY LATCH RELEASED</div>
      </div>
    </div>

    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>

    <div id="ceremony-container">
      <div id="college-title">Dhole Patil College of Engineering, Pune</div>
      <img id="ceremony-logo" src="logo.svg" alt="DPES Logo">
      <h1 id="ceremony-title">Department of Computer Engineering</h1>
      <div id="post-cut-message">Welcome to the Future of Innovation</div>
    </div>

    <canvas id="c"></canvas>

    <script>
      function requestFullscreen() {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
        document.removeEventListener('click', requestFullscreen);
        document.removeEventListener('touchstart', requestFullscreen);
      }
      document.addEventListener('click', requestFullscreen, { once: true });
      document.addEventListener('touchstart', requestFullscreen, { once: true });

      const bgCanvas = document.getElementById('bg-cyber-canvas');
      const bgCtx = bgCanvas.getContext('2d');
      let bgParticles = [];

      function initBgParticles() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        bgParticles = [];
        for (let i = 0; i < 40; i++) {
          bgParticles.push({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            radius: Math.random() * 2 + 1,
            vy: -Math.random() * 0.4 - 0.15,
            alpha: Math.random() * 0.4 + 0.15
          });
        }
      }

      function animateBgParticles() {
        if (document.getElementById('scan-screen').classList.contains('hidden')) return;
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        for (let p of bgParticles) {
          p.y += p.vy;
          if (p.y < 0) p.y = bgCanvas.height;
          bgCtx.fillStyle = '#b8860b';
          bgCtx.globalAlpha = p.alpha;
          bgCtx.beginPath();
          bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.globalAlpha = 1.0;
        requestAnimationFrame(animateBgParticles);
      }
      initBgParticles();
      animateBgParticles();
      window.addEventListener('resize', initBgParticles);

      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.scanOsc = null;
          this.scanGain = null;
          this.lfo = null;
          this.initialized = false;
        }

        init() {
          if (this.initialized) return;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            this.initialized = true;
          } catch (e) {
            console.warn("Web Audio API not supported", e);
          }
        }

        ensureContext() {
          this.init();
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        playHover() {
          this.ensureContext();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        }

        startScan() {
          this.ensureContext();
          if (!this.ctx || this.scanOsc) return;

          this.scanOsc = this.ctx.createOscillator();
          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          this.scanGain = this.ctx.createGain();

          this.scanOsc.type = 'sine';
          this.scanOsc.frequency.setValueAtTime(440, this.ctx.currentTime);

          lfo.type = 'sine';
          lfo.frequency.setValueAtTime(6, this.ctx.currentTime);
          lfoGain.gain.setValueAtTime(80, this.ctx.currentTime);

          lfo.connect(this.scanOsc.frequency);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1000, this.ctx.currentTime);

          this.scanGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
          this.scanGain.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime + 0.2);

          this.scanOsc.connect(filter);
          filter.connect(this.scanGain);
          this.scanGain.connect(this.ctx.destination);

          lfo.start();
          this.scanOsc.start();
          this.lfo = lfo;
        }

        stopScan() {
          if (this.scanGain && this.ctx) {
            this.scanGain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
            setTimeout(() => {
              if (this.scanOsc) {
                try { this.scanOsc.stop(); this.scanOsc.disconnect(); } catch (e) { }
                this.scanOsc = null;
              }
              if (this.lfo) {
                try { this.lfo.stop(); this.lfo.disconnect(); } catch (e) { }
                this.lfo = null;
              }
            }, 200);
          }
        }

        playGranted() {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.001, now + idx * 0.08);
            gain.gain.linearRampToValueAtTime(0.18, now + idx * 0.08 + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.6);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.6);
          });

          const subOsc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(150, now);
          subOsc.frequency.exponentialRampToValueAtTime(40, now + 0.8);
          subGain.gain.setValueAtTime(0.3, now);
          subGain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
          subOsc.connect(subGain);
          subGain.connect(this.ctx.destination);
          subOsc.start(now);
          subOsc.stop(now + 0.8);
        }

        playUnlock() {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.15);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);

          const energyOsc = this.ctx.createOscillator();
          const energyGain = this.ctx.createGain();
          energyOsc.type = 'sine';
          energyOsc.frequency.setValueAtTime(1800, now + 0.1);
          energyOsc.frequency.exponentialRampToValueAtTime(2400, now + 0.4);
          energyGain.gain.setValueAtTime(0.15, now + 0.1);
          energyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          energyOsc.connect(energyGain);
          energyGain.connect(this.ctx.destination);
          energyOsc.start(now + 0.1);
          energyOsc.stop(now + 0.4);
        }

        playCurtain() {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const bufferSize = Math.floor(this.ctx.sampleRate * 1.2);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }

          const whiteNoise = this.ctx.createBufferSource();
          whiteNoise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(150, now);
          filter.frequency.exponentialRampToValueAtTime(600, now + 0.6);
          filter.frequency.exponentialRampToValueAtTime(100, now + 1.2);
          filter.Q.setValueAtTime(2, now);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.5);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

          whiteNoise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          whiteNoise.start(now);
          whiteNoise.stop(now + 1.2);
        }

        playCut() {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const sliceOsc = this.ctx.createOscillator();
          const sliceGain = this.ctx.createGain();
          sliceOsc.type = 'sawtooth';
          sliceOsc.frequency.setValueAtTime(2800, now);
          sliceOsc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
          sliceGain.gain.setValueAtTime(0.3, now);
          sliceGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          sliceOsc.connect(sliceGain);
          sliceGain.connect(this.ctx.destination);
          sliceOsc.start(now);
          sliceOsc.stop(now + 0.12);

          const chord = [293.66, 369.99, 440.00, 587.33, 739.99, 880.00];
          chord.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + 0.05 + i * 0.04);
            gain.gain.setValueAtTime(0.001, now + 0.05 + i * 0.04);
            gain.gain.linearRampToValueAtTime(0.15, now + 0.08 + i * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + 0.05 + i * 0.04);
            osc.stop(now + 1.8);
          });

          for (let i = 0; i < 6; i++) {
            const chimeOsc = this.ctx.createOscillator();
            const chimeGain = this.ctx.createGain();
            chimeOsc.type = 'sine';
            const chimeFreq = 1200 + Math.random() * 2000;
            const startTime = now + 0.3 + i * 0.15;
            chimeOsc.frequency.setValueAtTime(chimeFreq, startTime);
            chimeGain.gain.setValueAtTime(0.08, startTime);
            chimeGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
            chimeOsc.connect(chimeGain);
            chimeGain.connect(this.ctx.destination);
            chimeOsc.start(startTime);
            chimeOsc.stop(startTime + 0.4);
          }
        }
      }

      const soundEngine = new SoundEngine();

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      let width, height;
      let points = [];
      let constraints = [];
      let trail = [];
      let confetti = [];
      let sparks = [];
      let activeHoriz = null;

      const friction = 0.99;
      let gravity = 0.3;
      let isSevered = false;

      const spacing = 34;
      const rows = 4;
      let cols;

      let mouse = { down: false, x: -1000, y: -1000 };
      let lastMouse = { x: -1000, y: -1000 };

      class Point {
        constructor(x, y, col, row) {
          this.x = x;
          this.y = y;
          this.px = x;
          this.py = y;
          this.vx = 0;
          this.vy = 0;
          this.pin_x = null;
          this.pin_y = null;
          this.col = col;
          this.row = row;
        }

        update() {
          if (this.pin_x !== null) {
            this.x = this.pin_x;
            this.y = this.pin_y;
            return;
          }

          this.vx = (this.x - this.px) * friction;
          this.vy = (this.y - this.py) * friction;

          this.px = this.x;
          this.py = this.y;

          this.x += this.vx;
          this.y += this.vy + gravity;
        }
      }

      class Constraint {
        constructor(p1, p2, isShear = false, isHorizontal = false) {
          this.p1 = p1;
          this.p2 = p2;
          this.length = isShear ? spacing * Math.SQRT2 : spacing;
          this.stiffness = 1.0;
          this.isHorizontal = isHorizontal;
        }

        resolve() {
          let dx = this.p1.x - this.p2.x;
          let dy = this.p1.y - this.p2.y;
          let distSq = dx * dx + dy * dy;
          if (distSq === 0) return;

          let dist = Math.sqrt(distSq);
          let diff = ((this.length - dist) / dist) * this.stiffness;

          if (this.p1.pin_x === null && this.p2.pin_x === null) {
            let px = dx * diff * 0.5;
            let py = dy * diff * 0.5;
            this.p1.x += px;
            this.p1.y += py;
            this.p2.x -= px;
            this.p2.y -= py;
          } else if (this.p1.pin_x !== null && this.p2.pin_x === null) {
            this.p2.x -= dx * diff;
            this.p2.y -= dy * diff;
          } else if (this.p1.pin_x === null && this.p2.pin_x !== null) {
            this.p1.x += dx * diff;
            this.p1.y += dy * diff;
          }
        }
      }

      function initCloth() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;

        points = [];
        constraints = [];
        confetti = [];
        sparks = [];
        isSevered = false;
        gravity = 0.3;
        document.getElementById('ceremony-status').classList.remove('visible');

        cols = Math.floor(width / spacing);
        activeHoriz = new Uint8Array(rows * cols);
        activeHoriz.fill(1);

        const startY = height / 2;

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            let pX = (x / (cols - 1)) * width;
            let pY = startY + y * spacing;
            let p = new Point(pX, pY, x, y);

            if (x === 0 || x === cols - 1) {
              p.pin_x = p.x;
              p.pin_y = p.y;
            }
            points.push(p);
          }
        }

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            let p = points[y * cols + x];
            if (x > 0) {
              constraints.push(new Constraint(p, points[y * cols + (x - 1)], false, true));
            }
            if (y > 0) {
              constraints.push(new Constraint(p, points[(y - 1) * cols + x], false, false));
            }
            if (x > 0 && y > 0) {
              constraints.push(new Constraint(p, points[(y - 1) * cols + (x - 1)], true, false));
            }
            if (x < cols - 1 && y > 0) {
              constraints.push(new Constraint(p, points[(y - 1) * cols + (x + 1)], true, false));
            }
          }
        }
      }

      function spawnSparks(x, y) {
        if (sparks.length > 25) return;
        for (let i = 0; i < 5; i++) {
          sparks.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            size: Math.random() * 3 + 2,
            color: Math.random() > 0.3 ? '#ffd700' : '#ffffff',
            life: 1.0
          });
        }
      }

      function triggerCelebration() {
        if (isSevered) return;
        isSevered = true;

        soundEngine.playCut();

        setTimeout(() => {
          document.getElementById('ceremony-logo').classList.add('revealed');
        }, 300);

        setTimeout(() => {
          document.getElementById('ceremony-status').classList.add('visible');
        }, 600);

        setTimeout(() => {
          document.getElementById('post-cut-message').classList.add('visible');
        }, 1000);

        const colors = ['#ffd700', '#ba0d0d', '#ffffff', '#e6b800', '#ff4d4d', '#c0c0c0'];
        for (let i = 0; i < 150; i++) {
          confetti.push({
            x: Math.random() * width,
            y: Math.random() * (height * 0.4),
            vx: (Math.random() - 0.5) * 12,
            vy: Math.random() * -6 - 2,
            size: Math.random() * 9 + 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.2,
            osc: Math.random() * 10
          });
        }
      }

      function update() {
        if (mouse.x > 0 && mouse.y > 0) {
          trail.push({ x: mouse.x, y: mouse.y, age: 1.0 });
        }
        for (let i = trail.length - 1; i >= 0; i--) {
          trail[i].age -= 0.1;
          if (trail[i].age <= 0) trail.splice(i, 1);
        }

        let cutOccurred = false;
        // CUT ONLY WHEN ACTIVE PRESS/CLICK (mouse.down is true)
        if (mouse.down && mouse.x > 0 && mouse.y > 0 && points.length > 0) {
          let severedCols = new Set();

          for (let x = 0; x < cols - 1; x++) {
            let pTop = points[x];
            let pBottom = points[(rows - 1) * cols + x];
            if (!pTop || !pBottom) continue;

            let colX = (pTop.x + pBottom.x) / 2;
            let minY = Math.min(pTop.y, pBottom.y) - 30;
            let maxY = Math.max(pTop.y, pBottom.y) + 30;

            if (mouse.y >= minY && mouse.y <= maxY) {
              if (Math.abs(mouse.x - colX) <= spacing * 0.9) {
                severedCols.add(x);
              }
              if (lastMouse.x > 0 && ((lastMouse.x <= colX && mouse.x >= colX) || (lastMouse.x >= colX && mouse.x <= colX))) {
                severedCols.add(x);
              }
            }
          }

          if (severedCols.size > 0) {
            for (let colIdx of severedCols) {
              let midPointX = (colIdx / (cols - 1)) * width;
              spawnSparks(midPointX, height / 2);

              for (let y = 0; y < rows; y++) {
                activeHoriz[y * cols + colIdx] = 0;
              }

              for (let i = constraints.length - 1; i >= 0; i--) {
                let c = constraints[i];
                let minC = Math.min(c.p1.col, c.p2.col);
                let maxC = Math.max(c.p1.col, c.p2.col);
                if (minC === colIdx && maxC === colIdx + 1) {
                  constraints.splice(i, 1);
                }
              }

              for (let p of points) {
                if (Math.abs(p.col - colIdx) <= 3 && p.pin_x === null) {
                  p.vy += 14;
                }
              }
            }
            gravity = 1.0;
            cutOccurred = true;
          }

          if (cutOccurred) {
            triggerCelebration();
          }
        }

        for (let p of points) p.update();
        for (let i = 0; i < 10; i++) {
          for (let c of constraints) c.resolve();
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          let s = sparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.2;
          s.life -= 0.05;
          if (s.life <= 0) sparks.splice(i, 1);
        }

        for (let c of confetti) {
          c.x += c.vx + Math.sin(c.osc) * 1.5;
          c.y += c.vy + 3.0;
          c.vy = Math.min(c.vy + 0.1, 4.0);
          c.rotation += c.vRot;
          c.osc += 0.05;
        }

        lastMouse.x = mouse.x;
        lastMouse.y = mouse.y;
      }

      const quadColors = [
        '#ba0d0d',
        '#cc1111',
        '#ba0d0d'
      ];

      function draw() {
        ctx.clearRect(0, 0, width, height);

        if (!activeHoriz) return;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        for (let y = 0; y < rows - 1; y++) {
          for (let x = 0; x < cols - 1; x++) {
            if (activeHoriz[y * cols + x] === 1) {
              let p1 = points[y * cols + x];
              let p2 = points[y * cols + x + 1];
              let p3 = points[(y + 1) * cols + x + 1];
              let p4 = points[(y + 1) * cols + x];

              ctx.beginPath();
              ctx.moveTo(p1.x + 6, p1.y + 10);
              ctx.lineTo(p2.x + 6, p2.y + 10);
              ctx.lineTo(p3.x + 6, p3.y + 10);
              ctx.lineTo(p4.x + 6, p4.y + 10);
              ctx.closePath();
              ctx.fill();
            }
          }
        }

        for (let y = 0; y < rows - 1; y++) {
          ctx.fillStyle = quadColors[y] || quadColors[0];
          ctx.strokeStyle = quadColors[y] || quadColors[0];
          ctx.lineWidth = 1.0;

          for (let x = 0; x < cols - 1; x++) {
            if (activeHoriz[y * cols + x] === 1) {
              let p1 = points[y * cols + x];
              let p2 = points[y * cols + x + 1];
              let p3 = points[(y + 1) * cols + x + 1];
              let p4 = points[(y + 1) * cols + x];

              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.lineTo(p3.x, p3.y);
              ctx.lineTo(p4.x, p4.y);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          }
        }

        for (let s of sparks) {
          ctx.fillStyle = s.color;
          ctx.globalAlpha = s.life;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        if (trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);
          for (let i = 1; i < trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
          }
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 3.5;
          ctx.stroke();
        }

        for (let c of confetti) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rotation);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
          ctx.restore();
        }
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // --- EVENT LISTENERS ---
      window.addEventListener('mousedown', (e) => {
        soundEngine.ensureContext();
        mouse.down = true;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        lastMouse.x = mouse.x;
        lastMouse.y = mouse.y;
      });

      window.addEventListener('mouseup', () => { mouse.down = false; });

      window.addEventListener('mousemove', (e) => {
        if (lastMouse.x < 0) {
          lastMouse.x = e.clientX;
          lastMouse.y = e.clientY;
        }
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('touchstart', (e) => {
        soundEngine.ensureContext();
        mouse.down = true;
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        lastMouse.x = mouse.x;
        lastMouse.y = mouse.y;
      }, { passive: true });

      window.addEventListener('touchend', () => { mouse.down = false; });

      window.addEventListener('touchmove', (e) => {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      });

      window.addEventListener('resize', () => { if (ceremonyStarted) initCloth(); });

      let ceremonyStarted = false;

      const handArea = document.getElementById('hand-area');
      const scanStatus = document.getElementById('scan-status');
      const scanProgress = document.getElementById('scan-progress');
      const scanPercent = document.getElementById('scan-percent');

      handArea.addEventListener('mouseenter', () => soundEngine.playHover());

      function startScan() {
        if (handArea.classList.contains('scanning') || handArea.classList.contains('granted')) return;

        soundEngine.ensureContext();
        soundEngine.startScan();

        handArea.classList.add('scanning');
        scanStatus.innerHTML = '<span class="status-symbol">❖</span> AUTHENTICATING AUTHORIZED GUEST...';

        let pct = 0;
        const interval = setInterval(() => {
          pct += Math.floor(Math.random() * 8) + 4;
          if (pct > 100) pct = 100;

          scanProgress.style.width = pct + '%';
          scanPercent.textContent = 'AUTHORIZATION MATCH: ' + pct + '%';

          if (pct >= 100) {
            clearInterval(interval);
            soundEngine.stopScan();
            soundEngine.playGranted();

            handArea.classList.remove('scanning');
            handArea.classList.add('granted');
            scanStatus.innerHTML = '<span class="status-symbol">✓</span> AUTHORIZATION CONFIRMED • WELCOME';
            scanStatus.classList.add('granted');

            setTimeout(startLockPhase, 700);
          }
        }, 70);
      }

      handArea.addEventListener('click', startScan);
      handArea.addEventListener('touchstart', (e) => { e.preventDefault(); startScan(); });

      function startLockPhase() {
        document.getElementById('scan-screen').classList.add('hidden');
        const lockOverlay = document.getElementById('lock-overlay');
        lockOverlay.classList.add('visible');

        setTimeout(() => {
          soundEngine.playUnlock();
          document.getElementById('lock-shackle').classList.add('unlocked-shackle');

          setTimeout(startCurtainPhase, 700);
        }, 800);
      }

      function startCurtainPhase() {
        document.getElementById('lock-overlay').classList.add('hidden');
        soundEngine.playCurtain();

        setTimeout(() => {
          document.querySelector('.curtain-left').classList.add('open');
          document.querySelector('.curtain-right').classList.add('open');

          setTimeout(() => {
            ceremonyStarted = true;
            document.getElementById('college-title').classList.add('animate');
            document.getElementById('ceremony-logo').classList.add('animate');
            document.getElementById('ceremony-title').classList.add('animate');
            initCloth();
            loop();
          }, 600);
        }, 300);
      }
    </script>
